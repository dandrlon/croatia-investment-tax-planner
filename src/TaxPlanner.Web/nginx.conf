server {
    listen 8080;
    root /usr/share/nginx/html;

    # The API accepts CSV files up to 10 MB; nginx's default limit is 1 MB.
    client_max_body_size 11m;

    # The UI and the API share one origin, so the browser needs no CORS.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
    }

    location /swagger {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
    }

    location /openapi {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
    }

    # Single-page app: unknown paths get index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
